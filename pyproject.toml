[project]
name = "mathcoffee"
version = "0.2.0a1"
description = "Local, agent-native mathematical video production with versioned style presets."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
mathcoffee = "mathcoffee.cli:main"

[project.optional-dependencies]
render = ["manim==0.20.1"]
notebook = ["manim[jupyterlab]==0.20.1"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "mathcoffee_build"
backend-path = ["."]

[tool.uv.build-backend]
source-include = ["mathcoffee_build.py", "repository-files.txt", "engines/remotion/**", "toolchains/**", "skills/**", "bin/**", "plugin.json", ".claude-plugin/**", ".agents/**", "uv.lock"]
source-exclude = ["node_modules", "__pycache__", ".npm-cache", ".cache", "out", "*.pyc"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["media"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
